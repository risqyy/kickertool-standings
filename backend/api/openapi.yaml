openapi: 3.0.3
info:
  title: Kickertool Ranking API
  version: 1.0.3
  description: Versioned public ranking and protected administration contract.
servers:
  - url: /
paths:
  /api/v1/public/rankings:
    get:
      operationId: listPublicRankings
      parameters:
        - name: year
          in: query
          required: false
          description: Four-digit calendar year for a completed-tournament ranking; omit for the cumulative ranking.
          schema:
            type: integer
            format: int32
            minimum: 1000
            maximum: 9999
        - name: month
          in: query
          required: false
          description: Calendar month in Europe/Berlin; requires year. Omit for the full year.
          schema: { type: integer, minimum: 1, maximum: 12 }
      responses:
        '200':
          description: Cumulative ranking when selectedYear is null; otherwise ranking from included completed tournaments and effective active corrections in the selected Berlin calendar year or month.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankingResponse'
        '400':
          description: Invalid year or month query parameter (month requires year).
        '500': { $ref: '#/components/responses/InternalError' }
  /api/standings:
    get:
      deprecated: true
      operationId: legacyStandings
      responses:
        '200':
          description: Compatibility ranking JSON.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LegacyRankingRow' }
  /api/v1/admin/session:
    get:
      security: [{ basicAuth: [] }]
      operationId: adminSession
      responses:
        '200':
          description: Session and CSRF token bootstrap.
          content:
            application/json:
              schema:
                type: object
                required: [authenticated, csrf_token]
                properties:
                  authenticated: { type: boolean }
                  csrf_token: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/admin/dashboard:
    get:
      security: [{ basicAuth: [] }]
      responses:
        '200':
          description: Dashboard counters.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Dashboard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/admin/tournaments:
    get:
      security: [{ basicAuth: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: included, in: query, schema: { type: boolean } }
        - { name: state, in: query, schema: { type: string } }
        - { name: source, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: sort, in: query, schema: { type: string } }
        - { name: direction, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        '200':
          description: Filtered tournament page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentPage'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/admin/tournaments/{id}/refresh:
    post:
      operationId: startTournamentRefresh
      security: [{ basicAuth: [] }]
      description: >-
        Start a background standings refresh for this stored tournament, bypassing
        finalization and the daily recheck interval. Does not run discovery or
        advance the global successful-crawl timestamp. Existing complete results
        survive failed or incomplete attempts. Shares the regular crawler lock.
        Requires a JSON Content-Type, the session CSRF cookie and matching header,
        and a same-origin Origin header when supplied.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object }
            example: {}
      responses:
        '202':
          description: Accepted. Poll the returned job ID; the job outlives this request and has a ten-minute deadline.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TournamentRefreshJob' }
        '400': { description: Invalid tournament ID or non-JSON Content-Type. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: A crawl or refresh is running (sync_busy), or the stored source is not currently configured (source_unavailable).
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string, enum: [sync_busy, source_unavailable] }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { description: Refresh service unavailable. }
  /api/v1/admin/tournament-refreshes/{jobId}:
    get:
      operationId: getTournamentRefresh
      security: [{ basicAuth: [] }]
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Current job state. Failed jobs keep previous complete standings; diagnostics are logged server-side.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TournamentRefreshJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Unknown job, process restarted, or job evicted from the last 100 retained jobs. }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { description: Refresh service unavailable. }
  /api/v1/admin/tournaments/{id}/inclusion:
    patch:
      security: [{ basicAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [included, expectedVersion]
              properties:
                included: { type: boolean }
                expectedVersion: { type: integer, format: int64 }
                reason: { type: string, maxLength: 500 }
      responses:
        '200': { description: Inclusion changed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/players:
    get:
      security: [{ basicAuth: [] }]
      operationId: listAdminPlayers
      description: Lists every stored identity, including empty manual players and merged identities. Name and alias search uses literal normalized substrings. Ordered by canonical name, then ID.
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string, enum: [all, active, merged], default: all } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Player page from a consistent read snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerPage' }
        '400': { description: Invalid filter or pagination. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { description: Player statistics repository unavailable. }
    post:
      security: [{ basicAuth: [] }]
      operationId: createManualPlayer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName, confirmed]
              properties:
                displayName: { type: string, minLength: 2, maxLength: 120 }
                confirmed: { type: boolean, const: true }
      responses:
        '201':
          description: Manual player created without ranking/source data.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManualPlayerCreateResponse' }
        '400': { description: Empty, invalid, or overlong display name, or missing confirmation. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: A canonical name or alias already belongs to an active player.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManualPlayerConflictResponse' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/admin/players/{id}/statistics:
    get:
      security: [{ basicAuth: [] }]
      operationId: getAdminPlayerStatistics
      description: Overall canonical player totals, retained source rows and manual correction history from one database snapshot and time boundary. Merged identities resolve to their canonical player; requestedPlayer preserves the requested identity. No source crawl is performed.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Current aggregate with explanatory source values. Only counted tournament rows and effective corrections contribute; nullable metrics remain unknown.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerStatistics' }
        '400': { description: Invalid player ID. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { description: Player statistics repository unavailable. }
  /api/v1/admin/players/search:
    get:
      security: [{ basicAuth: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }
      responses:
        '200':
          description: Normalized player search results.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Player' } }
                  message: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/admin/players/merge/preview:
    post:
      security: [{ basicAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourcePlayerId, targetPlayerId]
              properties:
                sourcePlayerId: { type: integer }
                targetPlayerId: { type: integer }
      responses:
        '200': { description: Dry-run merge plan. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/players/merge/confirm:
    post:
      security: [{ basicAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, targetDisplayName, confirmed]
              properties:
                token: { type: string }
                targetDisplayName: { type: string }
                confirmed: { type: boolean, const: true }
      responses:
        '200': { description: Idempotent merge result. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/players/merges:
    get:
      security: [{ basicAuth: [] }]
      operationId: listPlayerMerges
      responses:
        '200':
          description: Newest-first audit history, including whether each merge can be safely undone.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PlayerMergeAudit' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/admin/players/merges/{mergeId}/undo/preview:
    post:
      security: [{ basicAuth: [] }]
      operationId: previewPlayerMergeUndo
      parameters:
        - { name: mergeId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Exact pre-merge player aggregates and a short-lived confirmation token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerMergeUndoPreviewResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/PlayerMergeUndoConflict' }
  /api/v1/admin/players/merges/{mergeId}/undo/confirm:
    post:
      security: [{ basicAuth: [] }]
      operationId: confirmPlayerMergeUndo
      parameters:
        - { name: mergeId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, confirmed]
              properties:
                token: { type: string }
                confirmed: { type: boolean, const: true }
                reason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Idempotent result after exact restoration of both original players and their references.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerMergeUndoResult' }
        '400': { description: Explicit confirmation is missing. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/PlayerMergeUndoConflict' }
  /api/v1/admin/players/{id}/corrections:
    get:
      security: [{ basicAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Immutable correction history and current optimistic version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualRankingCorrectionListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/admin/players/{id}/corrections/preview:
    post:
      security: [{ basicAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualRankingCorrectionInput' }
      responses:
        '200':
          description: Dry-run correction preview.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManualRankingCorrectionPreviewResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/players/corrections/confirm:
    post:
      security: [{ basicAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, confirmed]
              properties:
                token: { type: string }
                confirmed: { type: boolean, const: true }
                expectedVersion: { type: integer, format: int64 }
      responses:
        '200':
          description: Idempotent correction result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManualRankingCorrectionChangeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/players/{id}/corrections/{correctionId}/revoke:
    post:
      security: [{ basicAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: correctionId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion, reason, confirmed]
              properties:
                expectedVersion: { type: integer, format: int64 }
                reason: { type: string, minLength: 3, maxLength: 500 }
                confirmed: { type: boolean, const: true }
      responses:
        '200':
          description: Correction revocation and recalculated aggregate.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManualRankingCorrectionRevocationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Backend-only HTTP Basic Authentication. Base64 is not encryption.
  schemas:
    RankingResponse:
      type: object
      required: [items, lastSyncAt, lastSyncStatus, availableYears, selectedYear, availableMonths, selectedMonth]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PublicRankingRow' } }
        lastSyncStatus:
          type: string
          enum: [ok, never, error]
          description: Whether the last fully successful crawl completion is available, none has been recorded, or status retrieval failed. Independent of ranking period.
        lastSyncAt:
          type: string
          format: date-time
          nullable: true
          description: Persisted completion of the last fully successful crawl, including unchanged runs. Null for never/error status. Failed later crawls leave the previous successful completion intact.
        availableYears:
          type: array
          description: Years with included, completed tournaments and complete standings, newest first.
          items: { type: integer, format: int32 }
        selectedYear: { type: integer, format: int32, nullable: true }
        selectedMonth: { type: integer, minimum: 1, maximum: 12, nullable: true }
        availableMonths:
          type: array
          description: Newest first; qualified tournament months and correction-only months that produce ranking entries.
          items:
            type: object
            required: [year, month]
            properties:
              year: { type: integer, minimum: 1000, maximum: 9999 }
              month: { type: integer, minimum: 1, maximum: 12 }
    RankingRow:
      type: object
      description: Only current source results contribute. Explicit zero-game entries contribute no tournament or metrics; missing games remain unknown. Effective manual corrections apply independently.
      required: [rank, name, includedTournamentCount]
      properties:
        rank: { type: integer }
        name: { type: string }
        includedTournamentCount: { type: integer, description: Distinct contributing tournaments plus effective manual count corrections. }
        gamesPlayed: { type: integer, nullable: true }
        totalPoints: { type: string, pattern: '^-?\d+\.\d{2}$', nullable: true }
        pointsPerGame: { type: string, pattern: '^-?\d+\.\d{2}$', nullable: true }
        goalDifference: { type: integer, nullable: true }
    PublicRankingRow:
      allOf:
        - $ref: '#/components/schemas/RankingRow'
        - type: object
          required: [trend, pointsPerGameTrend, goalDifferenceTrend]
          properties:
            trend: { type: string, enum: [up, down, same, new] }
            pointsPerGameTrend:
              allOf:
                - $ref: '#/components/schemas/MetricTrend'
              description: Compares commercially rounded hundredths displayed as pointsPerGame; unavailable if either snapshot lacks known positive games or points.
            goalDifferenceTrend:
              allOf:
                - $ref: '#/components/schemas/MetricTrend'
              description: Compares exact integer goal differences independently of pointsPerGameTrend.
    MetricTrend:
      type: string
      enum: [up, down, same, unavailable]
      description: Higher values are improvements. Compares against the ranking before the latest included completed tournament with complete standings within the selected period. Unavailable means a valid before or after value is missing. Effective corrections use the same cutoff as the placement trend. Repeated unchanged crawls do not change the baseline.
    LegacyRankingRow:
      allOf:
        - $ref: '#/components/schemas/RankingRow'
    Dashboard:
      type: object
      required: [tournamentCount, includedTournamentCount, excludedTournamentCount, playerCount]
      properties:
        tournamentCount: { type: integer }
        includedTournamentCount: { type: integer }
        excludedTournamentCount: { type: integer }
        playerCount: { type: integer }
        lastSyncAt: { type: string, format: date-time, nullable: true }
    TournamentPage:
      type: object
      required: [items, page, limit, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Tournament' } }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        last_sync_at: { type: string, format: date-time, nullable: true }
    TournamentRefreshJob:
      type: object
      required: [id, tournamentId, state, startedAt, finishedAt]
      properties:
        id: { type: string }
        tournamentId: { type: integer, minimum: 1 }
        state: { type: string, enum: [running, succeeded, failed] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
    Tournament:
      type: object
      required: [id, name, source, includedInRanking, inclusionVersion]
      properties:
        id: { type: integer }
        name: { type: string }
        source: { type: string }
        status: { type: string, nullable: true }
        isLive: { type: boolean }
        date: { type: string, format: date-time, nullable: true }
        includedInRanking: { type: boolean }
        inclusionVersion: { type: integer, format: int64 }
    PlayerSummary:
      type: object
      required: [id, displayName, active, mergedIntoPlayerId]
      properties:
        id: { type: integer }
        displayName: { type: string }
        active: { type: boolean, description: False for merged identities. }
        mergedIntoPlayerId: { type: integer, nullable: true }
    PlayerPage:
      type: object
      required: [items, page, limit, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PlayerSummary' } }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer, format: int64 }
    PlayerTournamentContribution:
      type: object
      description: Retained source row, ordered by date descending (unknown dates last), tournament ID descending, then row ID descending. Metrics are source values even for non-counted rows. Superseded takes precedence over excluded, then zero_games. Archived obsolete identity collisions are not a complete revision history in this response.
      required: [id, tournamentId, name, date, source, sourceId, standingRank, standingSourceId, standingKey, sourcePlayerName, url, status, reason, gamesPlayed, totalPointsCents, pointsPerGameCents, goalDifference]
      properties:
        id: { type: integer, description: Internal standing row ID; not the source rank or source result identifier. }
        tournamentId: { type: integer }
        name: { type: string, description: Falls back to the internal tournament ID when unnamed. }
        date: { type: string, format: date-time, nullable: true }
        source: { type: string }
        sourceId: { type: string, description: Source tournament identifier. }
        standingRank: { type: integer, nullable: true, description: Stored source standing position; unknown when absent. Never the overall ranking or inferred from the list order. }
        standingSourceId: { type: string, nullable: true, description: Source result identifier; null when absent. }
        standingKey: { type: string, description: Stored source standing key; empty when unavailable. }
        sourcePlayerName: { type: string, description: Player name on the stored source result; may differ from the canonical player after a merge. Empty when unknown. }
        url: { type: string, description: Stored standing result-page URL with tournament URL fallback when absent. HTTP(S) without credentials; empty when unavailable or unsafe. }
        status: { type: string }
        reason: { type: string, enum: [counted, excluded, zero_games, superseded] }
        gamesPlayed: { type: integer, nullable: true }
        totalPointsCents: { type: integer, format: int64, nullable: true }
        pointsPerGameCents: { type: integer, format: int64, nullable: true, description: Rounded source points per game; unknown for missing or non-positive games. }
        goalDifference: { type: integer, nullable: true }
    PlayerStatistics:
      type: object
      required: [requestedPlayer, player, tournaments, corrections, computedAt]
      properties:
        requestedPlayer: { $ref: '#/components/schemas/PlayerSummary' }
        player: { $ref: '#/components/schemas/Player' }
        tournaments: { type: array, items: { $ref: '#/components/schemas/PlayerTournamentContribution' } }
        corrections:
          type: array
          description: Canonical player's complete correction history, ordered by effective date descending then ID descending.
          items:
            type: object
            required: [correction, effective]
            properties:
              correction: { $ref: '#/components/schemas/ManualRankingCorrection' }
              effective: { type: boolean, description: True only for active corrections effective at computedAt. Active future corrections are scheduled. }
        computedAt: { type: string, format: date-time }
    Player:
      type: object
      required: [id, displayName, canonicalNameKey, createdAt, createdBy, origin, aliases, active, tournamentCount, gamesPlayed, totalPointsCents, pointsPerGameCents, goalDifference, rankingCorrectionVersion]
      properties:
        id: { type: integer }
        displayName: { type: string }
        aliases: { type: array, items: { type: string } }
        matchedAlias: { type: string }
        active: { type: boolean }
        mergedIntoPlayerId: { type: integer }
        canonicalNameKey: { type: string }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
        origin: { type: string }
        tournamentCount: { type: integer }
        gamesPlayed: { type: integer, nullable: true }
        totalPointsCents: { type: integer, format: int64, nullable: true }
        pointsPerGameCents: { type: integer, format: int64, nullable: true }
        goalDifference: { type: integer, nullable: true }
        rankingCorrectionVersion: { type: integer, format: int64 }
    ManualPlayerCreateResponse:
      type: object
      required: [created, player, createdAt, administrator, origin]
      properties:
        created: { type: boolean, const: true }
        player: { $ref: '#/components/schemas/Player' }
        createdAt: { type: string, format: date-time }
        administrator: { type: string }
        origin: { type: string, enum: [manual] }
    ManualPlayerConflictResponse:
      type: object
      required: [error, code, player]
      properties:
        error: { type: string }
        code: { type: string, enum: [player_exists] }
        player: { $ref: '#/components/schemas/Player' }
        existingPlayer: { $ref: '#/components/schemas/Player' }
    PlayerMergeAudit:
      type: object
      required: [id, sourcePlayerId, targetPlayerId, sourceDisplayName, targetDisplayName, mergedAt, transferredAliases, transferredSourceIdentities, transferredAllocations, deduplicatedAllocations, actor, reason, undoAvailable, undoUnavailableReason, undoneAt, undoneBy, undoReason]
      properties:
        id: { type: integer }
        sourcePlayerId: { type: integer }
        targetPlayerId: { type: integer }
        sourceDisplayName: { type: string }
        targetDisplayName: { type: string }
        mergedAt: { type: string, format: date-time }
        transferredAliases: { type: integer }
        transferredSourceIdentities: { type: integer }
        transferredAllocations: { type: integer }
        deduplicatedAllocations: { type: integer }
        actor: { type: string }
        reason: { type: string }
        undoAvailable: { type: boolean }
        undoUnavailableReason: { type: string }
        undoneAt: { type: string, format: date-time, nullable: true }
        undoneBy: { type: string }
        undoReason: { type: string }
    PlayerMergeUndoPreviewResponse:
      type: object
      required: [token, preview]
      properties:
        token: { type: string }
        preview:
          type: object
          required: [merge, sourceBefore, targetBefore]
          properties:
            merge: { $ref: '#/components/schemas/PlayerMergeAudit' }
            sourceBefore: { $ref: '#/components/schemas/RankingAggregate' }
            targetBefore: { $ref: '#/components/schemas/RankingAggregate' }
    PlayerMergeUndoResult:
      type: object
      required: [merge, sourceAfter, targetAfter, undoneAt]
      properties:
        merge: { $ref: '#/components/schemas/PlayerMergeAudit' }
        sourceAfter: { $ref: '#/components/schemas/RankingAggregate' }
        targetAfter: { $ref: '#/components/schemas/RankingAggregate' }
        undoneAt: { type: string, format: date-time }
    ManualRankingCorrectionInput:
      type: object
      required: [effectiveDate, effectiveYear, reason]
      properties:
        effectiveDate: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        effectiveYear: { type: integer, format: int32, minimum: 1 }
        tournamentCountDelta: { type: integer }
        gamesPlayedDelta: { type: integer }
        pointsCentsDelta: { type: integer, format: int64 }
        pointsDelta: { type: number, format: double }
        goalDifferenceDelta: { type: integer }
        reason: { type: string, minLength: 3, maxLength: 500 }
        replaceCorrectionId: { type: integer, minimum: 1 }
    ManualRankingCorrection:
      type: object
      required: [id, playerId, effectiveDate, effectiveYear, tournamentCountDelta, gamesPlayedDelta, pointsCentsDelta, goalDifferenceDelta, reason, administrator, createdAt, status, revision, version]
      properties:
        id: { type: integer }
        playerId: { type: integer }
        playerKey: { type: string }
        effectiveDate: { type: string, format: date }
        effectiveYear: { type: integer, format: int32 }
        tournamentCountDelta: { type: integer }
        gamesPlayedDelta: { type: integer }
        pointsCentsDelta: { type: integer, format: int64 }
        goalDifferenceDelta: { type: integer }
        reason: { type: string }
        administrator: { type: string }
        createdAt: { type: string, format: date-time }
        status: { type: string, enum: [active, revoked, replaced] }
        revokedAt: { type: string, format: date-time, nullable: true }
        revokedBy: { type: string }
        revocationReason: { type: string }
        revision: { type: integer, format: int64 }
        version: { type: integer, format: int64 }
        supersedesCorrectionId: { type: integer, nullable: true }
        replacedByCorrectionId: { type: integer, nullable: true }
    RankingAggregate:
      type: object
      required: [tournamentCount]
      properties:
        tournamentCount: { type: integer }
        gamesPlayed: { type: integer, nullable: true }
        totalPointsCents: { type: integer, format: int64, nullable: true }
        pointsPerGameCents: { type: integer, format: int64, nullable: true }
        goalDifference: { type: integer, nullable: true }
    ManualRankingCorrectionListResponse:
      type: object
      required: [items, version]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ManualRankingCorrection' } }
        version: { type: integer, format: int64 }
    ManualRankingCorrectionPreviewResponse:
      type: object
      required: [token, player, correction, before, after, expectedVersion]
      properties:
        token: { type: string }
        player: { $ref: '#/components/schemas/Player' }
        correction: { $ref: '#/components/schemas/ManualRankingCorrection' }
        before: { $ref: '#/components/schemas/RankingAggregate' }
        after: { $ref: '#/components/schemas/RankingAggregate' }
        expectedVersion: { type: integer, format: int64 }
        superseded: { $ref: '#/components/schemas/ManualRankingCorrection', nullable: true }
        preview: { $ref: '#/components/schemas/ManualRankingCorrectionPreview' }
        result:
          type: object
          required: [before, after]
          properties:
            before: { $ref: '#/components/schemas/RankingAggregate' }
            after: { $ref: '#/components/schemas/RankingAggregate' }
    ManualRankingCorrectionPreview:
      type: object
      required: [player, correction, before, after, expectedVersion]
      properties:
        player: { $ref: '#/components/schemas/Player' }
        correction: { $ref: '#/components/schemas/ManualRankingCorrection' }
        before: { $ref: '#/components/schemas/RankingAggregate' }
        after: { $ref: '#/components/schemas/RankingAggregate' }
        expectedVersion: { type: integer, format: int64 }
        superseded: { $ref: '#/components/schemas/ManualRankingCorrection', nullable: true }
    ManualRankingCorrectionChangeResponse:
      type: object
      required: [correction, before, after, version]
      properties:
        correction: { $ref: '#/components/schemas/ManualRankingCorrection' }
        before: { $ref: '#/components/schemas/RankingAggregate' }
        after: { $ref: '#/components/schemas/RankingAggregate' }
        version: { type: integer, format: int64 }
        superseded: { $ref: '#/components/schemas/ManualRankingCorrection', nullable: true }
    ManualRankingCorrectionRevocationResponse:
      type: object
      required: [correction, before, after, version]
      properties:
        correction: { $ref: '#/components/schemas/ManualRankingCorrection' }
        before: { $ref: '#/components/schemas/RankingAggregate' }
        after: { $ref: '#/components/schemas/RankingAggregate' }
        version: { type: integer, format: int64 }
  responses:
    Unauthorized:
      description: Missing or invalid Basic Auth.
      headers:
        WWW-Authenticate: { schema: { type: string } }
    Forbidden: { description: CSRF, origin, or mutation validation failure. }
    NotFound: { description: Resource not found. }
    Conflict: { description: Optimistic version or stale merge-plan conflict. }
    PlayerMergeUndoConflict:
      description: The merge is legacy, already undone, or its participants changed after merging, so exact restoration is unsafe.
      content:
        application/json:
          schema:
            type: object
            required: [error, code]
            properties:
              error: { type: string }
              code: { type: string, enum: [player_merge_undo_unavailable] }
    InternalError: { description: Internal backend error. }
