limit_req_zone $binary_remote_addr zone=api_rate:10m rate=20r/s;

# Keep the protocol supplied by a TLS-terminating reverse proxy. Without this,
# Nginx only sees its internal HTTP connection and the backend rejects browser
# mutations whose Origin uses the public HTTPS URL.
map $http_x_forwarded_proto $backend_forwarded_proto {
    default $scheme;
    "~*^https(?:,|$)" https;
    "~*^http(?:,|$)"  http;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=30s;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        limit_req zone=api_rate burst=40 nodelay;
        set $backend_upstream backend:8080;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        # Preserve the browser-visible host and port for the backend's
        # same-origin Origin check (important for local port mappings).
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $backend_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_request_buffering on;
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
