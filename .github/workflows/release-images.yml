name: Release container images

on:
  push:
    tags: ["*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-images-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    name: Test and publish images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pushed tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      # Quality gates intentionally run before registry login and any push.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test backend
        working-directory: backend
        run: go test ./...

      - name: Build backend
        working-directory: backend
        run: go build ./...

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm test -- --run

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Set image creation timestamp
        id: image-meta
        shell: bash
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/risqyy/kickertool-standings-backend
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/risqyy/kickertool-standings
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.image-meta.outputs.created }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,mode=max,scope=backend-image
          provenance: true
          sbom: true

      - name: Docker metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/risqyy/kickertool-standings-frontend
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/risqyy/kickertool-standings
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.image-meta.outputs.created }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend-image
          cache-to: type=gha,mode=max,scope=frontend-image
          provenance: true
          sbom: true
